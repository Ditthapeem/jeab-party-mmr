<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ก๊วนลูกเจี๊ยบ MMR 🐥</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f0ff;--card:#ffffff;--tx:#3d2f5c;--mut:#8f84ad;--pk:#a97bff;--pk2:#e3d6ff;--mint:#8fe3c8;--sky:#9ad4ff;--yel:#ffe08a;--bd:#dccdff;--red:#ff7a8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1830;--card:#2c2342;--tx:#f1eaff;--mut:#b3a6d1;--pk:#b794ff;--pk2:#43366a;--bd:#4a3d73}}
:root[data-theme="dark"]{--bg:#1f1830;--card:#2c2342;--tx:#f1eaff;--mut:#b3a6d1;--pk:#b794ff;--pk2:#43366a;--bd:#4a3d73}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Mali','Sarabun','Noto Sans Thai',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{text-align:center;margin:8px 0 4px;font-size:28px}
.sub{text-align:center;color:var(--mut);margin:0 0 14px;font-size:14px}
.topbar{position:relative;min-height:36px;padding-right:76px;margin-bottom:8px}
.topbar h1{margin:8px 0 4px}
.topbar .sub{margin:0 0 14px}
.rules-btn{position:absolute;right:0;top:4px;border:0;border-radius:14px;padding:8px 10px;background:var(--pk2);color:var(--tx);font:inherit;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.rules-btn.on{background:var(--card);box-shadow:0 2px 6px #a97bff55}
.tabs{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:5px;
  background:var(--pk2);
  padding:5px;
  border-radius:18px;
  margin-bottom:14px;
  width:100%;
}
.tabs button{
  min-width:0;
  font-size:clamp(10px, 2.8vw, 13px);
  border:0;
  background:none;
  padding:10px 2px;
  border-radius:14px;
  font-family:inherit;
  font-weight:600;
  line-height:1.25;
  color:var(--tx);
  cursor:pointer;
  white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.tabs button.on{background:var(--card);box-shadow:0 2px 6px #a97bff55}
@media (max-width:430px){
  .wrap{padding:12px}
  .topbar{padding-right:68px}
  .topbar h1{font-size:clamp(20px,5.5vw,26px);text-align:left;line-height:1.25;padding-top:4px}
  .topbar .sub{text-align:left;font-size:12px}
  .rules-btn{font-size:11px;padding:7px 8px;top:2px}
  .tabs{gap:4px;padding:4px}
  .tabs button{font-size:clamp(9px,2.7vw,12px);padding:11px 1px;letter-spacing:-.2px}
}
@media (max-width:360px){
  .tabs button{white-space:normal;font-size:10px;padding:8px 1px}
}
.card{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:14px;padding:9px 12px;width:100%}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:10px 16px;background:var(--pk);color:#fff;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.g{background:var(--mint);color:#235}
.btn.s{padding:5px 10px;font-size:12px;background:var(--pk2);color:var(--tx)}
.p{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:2px dashed var(--bd)}
.p:last-child{border:0}
.rk{width:34px;text-align:center;font-weight:700;font-size:18px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--pk2)}
.nm{flex:1;min-width:0}.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--mut)}
.mmr{font-weight:700;font-size:18px;text-align:right}
.mmr small{display:block;font-size:11px;font-weight:600}
.up{color:#2bb58a}.dn{color:var(--red)}
.team{border-radius:18px;padding:10px;margin-bottom:10px}
.ta{background:color-mix(in srgb,var(--sky) 30%,transparent)}.tb{background:color-mix(in srgb,var(--yel) 35%,transparent)}
.team h3{margin:0 0 8px;font-size:15px}
.team select{margin-bottom:6px}
.win{display:flex;gap:8px;margin:6px 0 12px}
.win label{flex:1;text-align:center;padding:10px;border-radius:16px;border:2px solid var(--bd);cursor:pointer;font-weight:600}
.win input{display:none}.win label.on{background:var(--pk);color:#fff;border-color:var(--pk)}
.h{padding:9px 2px;border-bottom:2px dashed var(--bd);font-size:14px}.h:last-child{border:0}
.h .d{color:var(--mut);font-size:12px}
.empty{text-align:center;color:var(--mut);padding:18px}
.tier{font-size:12px;color:var(--mut)}
.rule-title{font-size:17px;margin:0 0 8px}
.rule-list{margin:0;padding-left:20px;line-height:1.7}
.rule-list li{margin:4px 0}
.rule-table{width:100%;border-collapse:collapse;font-size:13px}
.rule-table th,.rule-table td{padding:8px 6px;text-align:left;border-bottom:1px dashed var(--bd);vertical-align:top}
.rule-table th{color:var(--mut);font-weight:700}
.rule-badge{display:inline-block;background:var(--pk2);border-radius:12px;padding:4px 9px;font-weight:700}
.rule-note{font-size:12px;color:var(--mut);line-height:1.6;margin:8px 0 0}
.chip{padding:6px 12px;border-radius:16px;border:2px solid var(--bd);cursor:pointer;font-size:14px}.chip.on{background:var(--pk);color:#fff;border-color:var(--pk)}
#pk{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:20}
.pkb{background:var(--card);border-radius:22px;padding:14px;max-width:320px;width:90%}
.pkg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pkg button{font-size:24px;border:0;background:var(--pk2);border-radius:14px;padding:6px 0;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(80px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;transition:.3s;font-weight:600;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="rules-btn" id="rulesBtn" aria-label="เปิดกติกาคะแนน">📊 Rules</button>
    <h1>🐥 MMR ก๊วนลูกเจี๊ยบ</h1>
    <p class="sub">ฝีมืออาจไม่มาก แต่ความมั่นหน้าระดับโลก! ✨</p>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="rank" class="on">🏆 Ranking</button>
    <button data-t="match">🎯 Record</button>
    <button data-t="pair">🤝 Matching</button>
    <button data-t="hist">📜 Career</button>
  </div>
  <div id="rank"></div>
  <div id="match" hidden></div>
  <div id="pair" hidden></div>
  <div id="hist" hidden></div>
  <div id="rules" hidden></div>
</div>
<div id="toast"></div>
<script>
const AV=['🐰','🐱','🐶','🐼','🦊','🐸','🐥','🦄','🐯','🐨','🐷','🐙'];
const ICONS=[...AV,'🐻','🐵','🦁','🐧','🦉','🐢','🐬','🦋','🐝','🐞','🍓','🍑','🌸','⭐','🔥','🏸','🐺','🐈','😺','😸'];
const LEG={'svg:butterfly':'🦋','svg:cat-km':'🐈','svg:cat-calico':'😺','svg:cat-seal':'😸'};
const ic=v=>LEG[v]||v,icT=ic;
let newAv=null,hf='';
function pickIcon(cb){const o=document.createElement('div');o.id='pk';o.innerHTML='<div class="pkb"><b>เลือกไอคอน ✨</b><div class="pkg" style="margin-top:10px">'+ICONS.map(e=>`<button data-v="${e}">${ic(e)}</button>`).join('')+'</div></div>';
  o.onclick=ev=>{if(ev.target===o)o.remove();else{const b=ev.target.closest('button');if(b){cb(b.dataset.v);o.remove()}}};document.body.appendChild(o)}
const TIERS=[[1500,'👑','ราชาขนไก่'],[1300,'🌟','ดาวเด่น'],[1100,'🏸','นักตบ'],[900,'🐣','ลูกเจี๊ยบ'],[0,'🥚','ไข่ทองคำ']];
const tier=m=>TIERS.find(t=>m>=t[0]);
const K=32,KN=48,NEWG=10,START=1000;
function scoreMult(s){const m=String(s).match(/(\d+)\s*[-:–]\s*(\d+)/);if(!m)return 1;return 1+Math.min(Math.abs(m[1]-m[2])/21,1)*0.5}
let S={players:[],matches:[]};
try{const r=localStorage.getItem('shuttle-mmr');if(r)S=JSON.parse(r)||S}catch(e){}
const save=()=>{try{localStorage.setItem('shuttle-mmr',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const byId=id=>S.players.find(p=>p.id===id);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
let win='A';

function renderRank(){
  const ps=[...S.players].sort((a,b)=>b.mmr-a.mmr);
  let h=`<div class="card"><div class="row"><button class="btn s" id="ni" title="เลือกไอคอน" style="font-size:22px;padding:4px 10px">${ic(newAv||AV[S.players.length%AV.length])}</button><input id="nn" placeholder="ชื่อผู้เล่นใหม่" maxlength="20"><button class="btn" id="add">เพิ่ม</button></div></div><div class="card">`;
  if(!ps.length)h+=`<div class="empty">ยังไม่มีผู้เล่น เพิ่มเพื่อนมาตีกันเลย! 🥚</div>`;
  ps.forEach((p,i)=>{
    const t=tier(p.mmr),g=p.w+p.l?Math.round(p.w*100/(p.w+p.l)):0;
    h+=`<div class="p"><div class="rk">${['🥇','🥈','🥉'][i]||i+1}</div><div class="av" data-av="${p.id}" style="cursor:pointer" title="เปลี่ยนไอคอน">${ic(p.av)}</div>
    <div class="nm"><b>${esc(p.name)}</b><small>${t[1]} ${t[2]} · ชนะ ${p.w} แพ้ ${p.l} (${g}%)</small></div>
    <div class="mmr">${p.mmr}<small class="${p.last>0?'up':p.last<0?'dn':''}">${p.last>0?'▲ +'+p.last:p.last<0?'▼ '+p.last:'–'}</small></div>
    <button class="btn s" data-ed="${p.id}" title="แก้ชื่อ">✏️</button><button class="btn s" data-del="${p.id}" title="ลบ">✕</button></div>`;
  });
  h+=`</div>`;
  if(S.players.length)h+=`<div style="text-align:center"><button class="btn s" id="reset">รีเซ็ตทั้งหมด</button></div>`;
  $('rank').innerHTML=h;
  const add=()=>{const n=$('nn').value.trim();if(!n)return;
    if(S.players.some(p=>p.name===n))return toast('ชื่อซ้ำนะ 🙈');
    S.players.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,mmr:START,w:0,l:0,last:0,av:newAv||AV[S.players.length%AV.length]});newAv=null;
    save();renderAll();toast('ยินดีต้อนรับ '+n+' 🎉')};
  $('add').onclick=add;$('ni').onclick=()=>{const v=$('nn').value;pickIcon(e=>{newAv=e;renderRank();$('nn').value=v})};$('nn').onkeydown=e=>{if(e.key==='Enter')add()};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const p=byId(b.dataset.del);if(confirm('ลบ '+p.name+' ?')){S.players=S.players.filter(x=>x.id!==p.id);save();renderAll()}});
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const p=byId(b.dataset.ed);const n=(prompt('แก้ชื่อผู้เล่น',p.name)||'').trim();if(!n||n===p.name)return;if(S.players.some(x=>x.name===n))return toast('ชื่อซ้ำนะ 🙈');p.name=n;S.matches.forEach(m=>[...m.A,...m.B].forEach(x=>{if(x.id===p.id)x.n=n}));save();renderAll();toast('แก้ชื่อแล้ว ✏️')});
  document.querySelectorAll('[data-av]').forEach(a=>a.onclick=()=>pickIcon(e=>{byId(a.dataset.av).av=e;save();renderAll()}));
  const r=$('reset');if(r)r.onclick=()=>{if(confirm('ลบข้อมูลทั้งหมด?')){S={players:[],matches:[]};save();renderAll()}};
}

function opts(){return '<option value="">— เลือกผู้เล่น —</option>'+[...S.players].sort((a,b)=>b.mmr-a.mmr).map(p=>`<option value="${p.id}">${esc(p.name)} (${p.mmr})</option>`).join('')}
function renderMatch(){
  if(S.players.length<2){$('match').innerHTML='<div class="card empty">ต้องมีผู้เล่นอย่างน้อย 2 คนก่อนนะ 🐥</div>';return}
  $('match').innerHTML=`<div class="card">
  <div class="team ta"><h3>💙 ทีม A</h3><select id="a1">${opts()}</select><select id="a2">${opts().replace('เลือกผู้เล่น','คู่ (ถ้าเล่นคู่)')}</select></div>
  <div class="team tb"><h3>💛 ทีม B</h3><select id="b1">${opts()}</select><select id="b2">${opts().replace('เลือกผู้เล่น','คู่ (ถ้าเล่นคู่)')}</select></div>
  <div class="win" id="win"><label data-w="A" class="on">💙 ทีม A ชนะ</label><label data-w="B">💛 ทีม B ชนะ</label></div>
  <input id="sc" placeholder="สกอร์ เช่น 21-17 (ยิ่งห่าง ยิ่งได้โบนัส)" maxlength="20" style="margin-bottom:12px">
  <button class="btn g" id="go" style="width:100%">บันทึกผล ✨</button></div>`;
  document.querySelectorAll('#win label').forEach(l=>l.onclick=()=>{win=l.dataset.w;document.querySelectorAll('#win label').forEach(x=>x.classList.toggle('on',x===l))});
  win='A';
  $('go').onclick=submit;
}
function submit(){
  const A=[$('a1').value,$('a2').value].filter(Boolean),B=[$('b1').value,$('b2').value].filter(Boolean);
  if(!A.length||!B.length)return toast('เลือกผู้เล่นให้ครบทั้งสองทีมนะ');
  if(A.length!==B.length)return toast('จำนวนผู้เล่นสองทีมต้องเท่ากัน');
  if(new Set([...A,...B]).size!==A.length+B.length)return toast('มีผู้เล่นซ้ำกัน 🙈');
  const avg=ids=>ids.reduce((s,i)=>s+byId(i).mmr,0)/ids.length;
  const ra=avg(A),rb=avg(B),ea=1/(1+Math.pow(10,(rb-ra)/400));
  const sa=win==='A'?1:0,mag=Math.abs(sa-ea),mult=scoreMult($('sc').value);
  const order=[...S.players].sort((a,b)=>b.mmr-a.mmr).map(p=>p.id),rk=id=>order.indexOf(id);let top=0;
  const snap=ids=>ids.map(i=>({id:i,n:byId(i).name}));
  const upd=(ids,won)=>ids.forEach(i=>{const p=byId(i),k=p.w+p.l<NEWG?KN:K;let d=k*mag*mult;
    if(!won){d=-d;if(ids.length===2){const o=ids.find(x=>x!==i);if(Math.abs(rk(i)-rk(o))>=5&&rk(i)<rk(o))d*=0.8}}
    d=Math.round(d);p.mmr+=d;p.last=d;won?p.w++:p.l++;if(won)top=Math.max(top,d)});
  upd(A,sa===1);upd(B,sa===0);
  S.matches.unshift({t:Date.now(),A:snap(A),B:snap(B),win,d:top,sc:$('sc').value.trim()});
  S.matches=S.matches.slice(0,100);
  save();renderAll();toast(`ทีม ${win} ชนะ! 🎉 +${top} MMR`);
  setTab('rank');
}
function renderHist(){
  if(hf&&!byId(hf))hf='';
  const ms=S.matches.filter(m=>!hf||[...m.A,...m.B].some(x=>x.id===hf));
  const wn=hf?ms.filter(m=>(m.win==='A'?m.A:m.B).some(x=>x.id===hf)).length:0;
  let h='<div class="card"><select id="hf"><option value="">👥 ทุกคน</option>'+[...S.players].sort((a,b)=>a.name.localeCompare(b.name,'th')).map(p=>`<option value="${p.id}"${p.id===hf?' selected':''}>${icT(p.av)} ${esc(p.name)}</option>`).join('')+'</select>'+(hf?`<div class="tier" style="margin:8px 2px 0">ชนะ ${wn} แพ้ ${ms.length-wn} จาก ${ms.length} แมตช์</div>`:'')+'<div style="height:8px"></div>';
  if(!ms.length)h+='<div class="empty">ยังไม่มีแมตช์ ไปตีกันเลย 🏸</div>';
  ms.forEach(m=>{
    const nm=t=>t.map(x=>esc(x.n)).join(' & ');
    const dt=new Date(m.t).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    h+=`<div class="h"><b>${m.win==='A'?'🏆 ':''}${nm(m.A)}</b> vs <b>${m.win==='B'?'🏆 ':''}${nm(m.B)}</b>
    <div class="d">${dt}${m.sc?' · '+esc(m.sc):''} · ±${m.d} MMR</div></div>`;
  });
  $('hist').innerHTML=h+'</div>';$('hf').onchange=e=>{hf=e.target.value;renderHist()};
}
let present=new Set(),lastGames=[],sess={};
const avgP=a=>a.reduce((s,p)=>s+p.mmr,0)/a.length;
const namesP=a=>a.map(p=>ic(p.av)+' '+esc(p.name)+' ('+p.mmr+')').join(' & ');
function renderPair(){
  if(S.players.length<2){$('pair').innerHTML='<div class="card empty">เพิ่มผู้เล่นอย่างน้อย 2 คนก่อนนะ 🐥</div>';return}
  const ps=[...S.players].sort((a,b)=>b.mmr-a.mmr);
  $('pair').innerHTML='<div class="card"><b>ใครมาตีวันนี้? 🏸</b><div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0">'+ps.map(p=>`<label class="chip${present.has(p.id)?' on':''}" data-c="${p.id}">${ic(p.av)} ${esc(p.name)}</label>`).join('')+'</div><button class="btn g" id="mk" style="width:100%">จัดคู่จากอันดับปัจจุบัน ✨</button><button class="btn s" id="rs" style="margin-top:8px">เริ่มนับรอบใหม่ 🌤️</button></div><div id="out"></div>';
  document.querySelectorAll('[data-c]').forEach(l=>l.onclick=()=>{const id=l.dataset.c;present.has(id)?present.delete(id):present.add(id);l.classList.toggle('on')});
  $('mk').onclick=makePairs;$('rs').onclick=()=>{sess={};lastGames=[];$('out').innerHTML='';toast('เริ่มนับรอบใหม่แล้ว 🌤️')};
}
function makePairs(){
  const sel=S.players.filter(p=>present.has(p.id));
  if(sel.length<2)return toast('เลือกอย่างน้อย 2 คนนะ');
  const st=p=>sess[p.id]||(sess[p.id]={g:0,b:0});

  // จัดลงสนามเฉพาะเกมประเภทคู่ (2 คนต่อทีม) เท่านั้น
  const ranked=[...sel].sort((a,b)=>b.mmr-a.mmr);
  lastGames=[];
  let i=0;
  while(ranked.length-i>=4){
    const g=ranked.slice(i,i+4);
    lastGames.push({A:[g[0],g[3]],B:[g[1],g[2]]});
    i+=4;
  }

  const rest=ranked.slice(i);
  let suggestion='';
  if(rest.length){
    // แสดงผู้เล่นที่เหลือเป็นคู่แนะนำ และระบุจำนวนผู้เล่นที่ต้องเติมเพื่อเปิดคอร์ทเพิ่ม
    const available=S.players.filter(p=>!present.has(p.id)).sort((a,b)=>b.mmr-a.mmr);
    let suggestedPair=[];
    if(rest.length===1){
      if(available.length) suggestedPair=[rest[0],available[0]];
      else suggestedPair=[rest[0]];
    }else{
      suggestedPair=rest.slice(0,2);
    }
    const need=Math.max(0,4-rest.length);
    suggestion=`<div class="card empty"><b>🤝 คู่แนะนำ</b><div style="margin-top:8px">${namesP(suggestedPair)}</div><div style="margin-top:8px">${rest.length===1 && available.length ? 'แนะนำจับคู่กับผู้เล่นที่ยังไม่ได้เลือก เพื่อให้ครบคู่' : `เหลือ ${rest.length} คน ต้องเติมอีก ${need} คนจึงจะเปิดคอร์ทคู่เพิ่มได้`}</div><div style="margin-top:8px">หรือใครไม่เหนื่อยเติมหน่อยจ้า 🥹🏸</div></div>`;
  }

  lastGames.forEach(g=>[...g.A,...g.B].forEach(p=>st(p).g++));
  $('out').innerHTML=lastGames.map((g,k)=>{
    const a=avgP(g.A),b=avgP(g.B),e=Math.round(100/(1+Math.pow(10,(b-a)/400)));
    return `<div class="card"><b>🏟️ คอร์ท ${k+1} · คู่</b><div class="team ta" style="margin-top:8px">💙 ${namesP(g.A)}</div><div class="team tb">💛 ${namesP(g.B)}</div><div class="row"><small class="tier" style="flex:1">โอกาสชนะ A ${e}% · B ${100-e}%</small><button class="btn s" data-u="${k}">ใช้บันทึกผล</button></div></div>`;
  }).join('')+suggestion;
  if(!lastGames.length && !rest.length){
    $('out').innerHTML='<div class="card empty">เลือกผู้เล่นเพื่อจัดคู่ได้เลย 🏸</div>';
  }
  document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{
    const g=lastGames[b.dataset.u];setTab('match');
    ['a1','a2','b1','b2'].forEach(x=>$(x).value='');
    g.A.forEach((p,j)=>$('a'+(j+1)).value=p.id);
    g.B.forEach((p,j)=>$('b'+(j+1)).value=p.id);
  });
}
function renderRules(){
  const tierRows=TIERS.map((t,i)=>{
    const low=t[0], high=i===0?'ขึ้นไป':TIERS[i-1][0]-1;
    return `<tr><td><b>${t[1]} ${t[2]}</b></td><td>${i===0?'1,500+':`${low.toLocaleString()}–${high.toLocaleString()}`}</td></tr>`;
  }).join('');
  $('rules').innerHTML=`
    <div class="card">
      <h3 class="rule-title">🏆 แรงค์ของก๊วนลูกเจี๊ยบ</h3>
      <p style="margin:0 0 10px">เริ่มต้นทุกคนที่ <span class="rule-badge">${START.toLocaleString()} MMR</span></p>
      <table class="rule-table">
        <thead><tr><th>แรงค์</th><th>คะแนน MMR</th></tr></thead>
        <tbody>${tierRows}</tbody>
      </table>
    </div>
    <div class="card">
      <h3 class="rule-title">📈 ได้แต้ม / เสียแต้มยังไง?</h3>
      <ul class="rule-list">
        <li>🏅 <b>ชนะ</b> ได้ MMR เพิ่ม ส่วน <b>แพ้</b> เสีย MMR</li>
        <li>🌱 <b>10 เกมแรกของแต่ละคน</b> ใช้ตัวคูณ K = ${KN} ทำให้คะแนนเปลี่ยนมากกว่าปกติ</li>
        <li>🐣 หลังจากนั้นใช้ตัวคูณ K = ${K}</li>
        <li>⚖️ คะแนนที่ได้หรือเสียขึ้นอยู่กับ MMR เฉลี่ยของทั้งสองทีม ไม่ได้บวก/ลบเท่ากันทุกเกม</li>
        <li>🎯 กรอกสกอร์ เช่น <b>21-17</b> เพื่อเพิ่มโบนัสตามส่วนต่างคะแนน</li>
        <li>🛡️ กรณีทีมแพ้เป็นคู่ หากอันดับของผู้เล่นห่างจากเพื่อนร่วมทีมตั้งแต่ 5 อันดับขึ้นไป และผู้เล่นคนนั้นอันดับสูงกว่า จะลดการเสียแต้มลง 20%</li>
      </ul>
      <p class="rule-note">หมายเหตุ: คะแนน MMR ปัดเป็นจำนวนเต็มทุกแมตช์ และระบบจะเก็บประวัติสูงสุด 100 แมตช์</p>
    </div>
    <div class="card">
      <h3 class="rule-title">🧮 โบนัสจากส่วนต่างสกอร์</h3>
      <p style="margin:0 0 8px">ยิ่งผลต่างคะแนนมาก โบนัสยิ่งสูง โดยเพิ่มได้สูงสุด 50%</p>
      <table class="rule-table">
        <thead><tr><th>ตัวอย่างสกอร์</th><th>โบนัสโดยประมาณ</th></tr></thead>
        <tbody>
          <tr><td>21-20</td><td>+2.4%</td></tr>
          <tr><td>21-17</td><td>+9.5%</td></tr>
          <tr><td>21-11</td><td>+23.8%</td></tr>
          <tr><td>21-0</td><td>+50% (สูงสุด)</td></tr>
        </tbody>
      </table>
      <p class="rule-note">โบนัสคิดจากสูตร: 1 + min(ส่วนต่างสกอร์ ÷ 21, 1) × 0.5</p>
    </div>
    <div class="card">
      <h3 class="rule-title">🤓 สูตรคำนวณแบบไม่ต้องปวดหัว</h3>
      <p style="margin:0;line-height:1.7">ระบบดูความเก่งเฉลี่ยของทั้งสองทีมก่อน แล้วคำนวณโอกาสชนะตาม MMR จากนั้นปรับแต้มตามผลแพ้ชนะ โบนัสสกอร์ และสถานะ 10 เกมแรก</p>
      <p class="rule-note">สรุป: ชนะทีมที่เก่งกว่า = มีโอกาสได้แต้มเยอะ / แพ้ทีมที่อ่อนกว่า = มีโอกาสเสียแต้มเยอะ 😅</p>
    </div>`;
}

function renderAll(){renderRank();renderMatch();renderPair();renderHist();renderRules()}
function setTab(t){
  ['rank','match','pair','hist','rules'].forEach(x=>$(x).hidden=x!==t);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('rulesBtn').classList.toggle('on',t==='rules');
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('rulesBtn').onclick=()=>setTab('rules');
renderAll();
</script>
</body>
</html>
